name: Verify Cairo yield helper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cairo/**"
      - ".github/workflows/compile-cairo.yml"
  push:
    branches: [main]
    paths:
      - "cairo/**"
      - ".github/workflows/compile-cairo.yml"

jobs:
  compile:
    name: Build Cairo 2 contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0

      - name: Format check
        working-directory: cairo
        run: scarb fmt --check

      - name: Compile helper
        working-directory: cairo
        run: scarb build

      - name: List built artifacts
        run: find cairo/target/dev -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostline_yield_helper_artifacts
          path: cairo/target/dev/
